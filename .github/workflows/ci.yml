# Apogee CI -- the CLI PIPELINE.
#
# Everything here builds, tests, packages and releases ONE deliverable: the
# `apogee` command-line executable. It is the "CLI pipeline" (user decision,
# 2026-09-25), named so because it will not stay the only one: the GUI
# applications, and whatever else ships later, get pipelines of their own.
# The CLI pipeline runs only when what the CLI is built from has changed since
# the latest release -- lib/scripts/changed.sh declares that, once -- and when
# it has not, the CLI is COPIED from that release instead: into this run's
# artifacts, and into the release a merge publishes. A pull request that
# changes only a GUI application, or only documentation, builds no CLI.
#
# Every build job shells out to lib/scripts/cicd.sh — the same script a
# developer runs locally. That is deliberate: the moment CI grows its own build
# steps, "works on my machine" becomes a real answer. If a step belongs in CI,
# it belongs in that script.
#
# This workflow must live at .github/workflows/ (GitHub's requirement), which is
# why it is the one build-related file not under lib/src/cli/. It stays a thin
# caller for exactly that reason: the CLI's build lives with the CLI.
#
# Gating policy (user decision, 2026-09-19, superseding 2026-08-24's
# "macos-arm64 only"): EVERY job that runs on a pull request is required for
# it -- the version check, the clone, all five unit-test runs and all five
# builds -- each of which reports success without building when the CLI is
# unchanged. (`what changed` is not listed: the matrix jobs need it, and a
# matrix job skipped because it failed never reports its required name, so
# its failure blocks the pull request anyway.) There is no
# `continue-on-error` in this file and there must not be one; a platform that
# cannot pass is a platform to fix, not to mark informational. GitHub enforces the requirement through the branch protection
# rule on `stable`, which lists these checks by their job names
# (`version bump`, `clone llama.cpp`, `unit tests <name>`, `build <name>`) --
# a renamed job has to be renamed there too. `tag and release` is NOT one of
# them: it only ever runs after the merge.
#
# Job policy (user decisions, 2026-09-19, 2026-09-20, 2026-09-22 and
# 2026-09-25): CI is the llama.cpp clone, the source suite per platform, then
# one executable build per platform -- five of them, the Intel Mac having been
# dropped -- each packaged into the archive a release ships (or, with the CLI
# unchanged, copied from the latest release); one pull-request-only check,
# `version bump`; and, once a pull request into `stable` is MERGED, `tag and
# release`, which publishes the release it makes. Nothing else.
#
# The release after a merge (user decisions, 2026-09-25) rebuilds nothing. It
# is named by `lib/release/VERSION` -- the release -- while
# the CLI keeps its own version in lib/src/cli/CMakeLists.txt, which changes
# only when the CLI does, and then to the release it ships in. Each build job
# packages its archive through .github/actions/package -- the same action
# release.yml uses, so the two cannot package differently -- proves the
# binary runs, and keeps the archive as an artifact of the run. When the pull
# request merges, `tag and release` runs lib/scripts/release-from-pr.sh: with
# the CLI changed, it finds that pull request's last green run, checks every
# archive was built from exactly the merged source tree and that the
# executable reports that version; with it unchanged, it copies the latest
# release's CLI archives. Then it creates the tag `v<VERSION>` at the merge
# commit together with the release. A merge whose version is already released
# publishes nothing, which is how a docs or hotfix merge declines to cut one.
# The script's header has the full order of checks.
#
# `version bump` exists because of that: a pull request that changes the CLI
# and forgets to bump lib/release/VERSION would otherwise merge and publish nothing,
# silently. It also says, on every pull request, what the merge will publish.
#
# The suite runs here again as of 2026-09-22, reversing 2026-09-20's "remove
# the tests from the CI/CD" -- but ONLY the source-level suite. Nothing in
# this pipeline runs a test that needs the `apogee` executable (user decision,
# 2026-09-22: "we should only be testing the source code"). What that drops,
# named because it is a real loss rather than a tidy-up: the 18 ctest entries
# that spawn the binary, `cli.install_parity` among them -- the case that
# keeps install drift closed, which MILESTONES records as Ommi's dominant
# early bug class. They remain in tests/CMakeLists.txt and still run under
# `make test`; they are simply not a gate here.
#
# Shape (user decisions, 2026-09-19, 2026-09-20, 2026-09-22 and 2026-09-25):
# two stages on a pull request, each a call into cicd.sh, and one job after
# the merge -- all of them after one question:
#
#   0. what changed        -- lib/scripts/changed.sh: has what the CLI is
#                             built from changed since the latest release?
#                             If not, every job below reports success without
#                             building, and the builds copy the release's
#                             archives instead (2026-09-25; the job says how,
#                             and why it cannot simply skip them).
#   1. clone llama.cpp     -- prove the pin resolves. llama.cpp ships with the
#                             tool, so a pin that no longer clones is a broken
#                             product, and no platform is worth building on it.
#   1. unit tests <plat>   -- `cicd.sh --unit-tests`: builds the apogee_tests
#                             target ALONE, llama.cpp off, and runs the binary.
#                             No executable is produced and ctest never runs.
#                             Beside the clone, not after it.
#   2. build <platform>    -- one job per platform, llama.cpp linked in like
#                             every build, once BOTH of the above agree; then
#                             packaged, run, and kept as an artifact. With
#                             the CLI unchanged: the latest release's archive
#                             for the platform, copied, run, and kept as the
#                             same artifact.
#   after the merge:
#      tag and release     -- the release lib/release/VERSION names, carrying the pull
#                             request's own archives or, with the CLI
#                             unchanged, the latest release's. Nothing is
#                             built.
#
# Why running the binary rather than `ctest -E <something>`: the add_test()
# entries live in CTest, not in the Catch2 binary, so invoking apogee_tests
# selects the source-level cases by construction. There is no exclusion list
# to maintain, and no way for a new executable-dependent test to leak in.
#
# Two earlier shapes, and why this is not either of them. On 2026-09-20 the
# suite was a separate job fed the build tree as an artifact -- it could only
# run after the builds it was meant to gate, and the handover was the thing
# that "did not make sense on a runner". Earlier on 2026-09-22 it shared the
# build's job, which compiled once but could only report after a full build.
# This stage compiles one target and gates the builds, because it needs
# neither llama.cpp nor an executable.
#
# What a runner needs beyond its image, per platform: the Linux images ship no
# libcurl headers (`find_package(CURL REQUIRED)` is the first hard lookup, and
# the whole configure fell over on it five seconds in); the Windows images ship
# MSYS2 pre-installed but off PATH, and the Windows build is a MinGW-w64 one
# (user decision, 2026-09-19) -- GCC in the UCRT64 environment on x64, clang in
# CLANGARM64 on arm64 -- so msys2/setup-msys2 puts the toolchain, cmake, ninja,
# pkgconf and MSYS2's Schannel curl in that shell and the build step runs
# inside it; macOS has curl in the SDK. Every runner passes --no-defer, so a
# misdetected host is a failure rather than the silent "deferred to CI"
# success it once was.

name: CI

# Trigger policy (user decisions, 2026-08-31 and 2026-09-25): a run starts on
# a PROPOSED merge or ON REQUEST, and after a COMPLETED merge only to release
# it -- never on an ordinary push, so work-in-progress commits on a branch
# with no PR open cost nothing:
#
#   pull_request       reviewing a merge before it happens (the gating one);
#                      and, as `closed` with the pull request merged, the
#                      release -- every other job skips that one
#   workflow_dispatch  gh workflow run CI --ref <branch>; with
#                      release_rehearsal_pr, a rehearsal of the release that
#                      pull request's merge would publish, and nothing else
#
# There is deliberately NO `push: [stable]` (user decision, 2026-09-25: a merge
# must not start a fresh run from `stable`). It used to rebuild and retest the
# merge commit, and nothing depends on that any more: the merged tree is the
# one the pull request's run already built and tested -- `tag and release`
# refuses to publish if it is not -- and the release ships that run's
# archives. A direct push to `stable` therefore runs nothing; the branch
# protection rule is what keeps changes arriving by pull request.
#
# `branches: [stable]` names the integration branch: a PR into any other
# branch triggers nothing.
#
# Fork PRs run with a read-only token and no secrets. Nothing here needs a
# secret, so they work -- keep it that way.
#
# Note the GitHub constraint the dispatch half depends on: workflow_dispatch is
# only offered for a workflow that exists on the repository's DEFAULT branch
# (`stable`). Deleting this file from `stable`, or renaming it there, removes
# the on-request half entirely. The dispatch reads the trigger list from
# `stable` but RUNS the workflow file from the ref you select, so per-branch job
# changes still apply.
on:
  pull_request:
    branches: [stable]
    # The default three, plus `closed` for the release after a merge.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      release_rehearsal_pr:
        description: >-
          Pull request number: rehearse the release its merge would publish --
          find its CI archives and check them, build nothing, publish nothing.
          Leave empty for an ordinary run.
        type: string
        default: ""

# Every job reads; the one that writes, `tag and release`, asks for its own.
permissions:
  contents: read

# A newer push to a pull request supersedes a build still running for it. The
# release after a merge is never superseded or cancelled: it has a group of
# its own.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'closed' && '-merged' || '' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  changes:
    # Has what the CLI is built from changed since the latest release? Every
    # other job reads the answer (user decision, 2026-09-25: the CLI pipeline
    # runs only when the CLI's own source changed, and a pull request that
    # changes something else -- documentation today, a GUI application one
    # day -- gets the latest release's CLI instead). What the CLI is built
    # from is declared once, in lib/scripts/changed.sh.
    #
    # Against the latest RELEASE, not the pull request's base: copying the
    # release is only true while the CLI in what would merge is the CLI that
    # was released, so that is the comparison. In the everyday case the two
    # agree -- every change to the CLI is released by the merge that made it.
    # The pull request is judged by its whole test merge, never its latest
    # push: `[skip ci]` in a commit message is the way to push documentation
    # mid-review without a run, and the pull request's last commit must still
    # run, or nothing is tested and the merge has nothing to release.
    #
    # How an unchanged CLI keeps the pull request mergeable, and why it is not
    # a job-level `if:`. The branch protection rule requires `unit tests
    # <name>` and `build <name>` by name, and a MATRIX job skipped by its `if:`
    # never expands: it reports once, as "build ${{ matrix.name }}", so the
    # required "build macos-arm64" waits forever and the pull request cannot
    # merge. So the matrix jobs, and `clone llama.cpp` which the builds need,
    # always run and skip the STEPS that build: each finishes quickly, under
    # its real name, successfully -- and each build job copies its platform's
    # archive from the latest release in place of building it.
    #
    # `tag and release` does not ask. It answers the same question itself at
    # publish time, against the release that is latest THEN -- and the
    # `closed` event is the one this job's checkout cannot be trusted on.
    #
    # On request (workflow_dispatch), everything runs. If this job fails, every
    # job after it is skipped, the required checks never report, and the pull
    # request cannot merge: fail closed.
    name: what changed
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
      latest: ${{ steps.diff.outputs.latest }}
    steps:
      # The whole history, so the latest release's commit is there to diff
      # from. The history is small.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # On a pull request HEAD is its test merge -- what would merge.
      - name: Has the CLI changed since the latest release?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          found="$(lib/scripts/latest-release.sh)"
          latest="" commit=""
          [ -z "$found" ] || read -r latest commit <<<"$found"
          echo "latest=$latest" | tee -a "$GITHUB_OUTPUT"
          case "$EVENT" in
            pull_request)
              lib/scripts/changed.sh cli "$commit" HEAD
              ;;
            *)
              echo "on request: everything runs"
              echo "cli=true" | tee -a "$GITHUB_OUTPUT"
              ;;
          esac

  version:
    # A merge into `stable` publishes a release, and what it publishes is
    # decided by lib/release/VERSION (user decisions, 2026-09-22 and
    # 2026-09-25; until then it was the CLI's own `project(... VERSION x.y.z)`
    # in lib/src/cli/CMakeLists.txt). A PR that forgets to bump it therefore
    # merges cleanly and then releases NOTHING -- a silent no-op that looks
    # exactly like a deliberate skip, and is only noticed by its absence.
    # This job makes that case loud at review time instead.
    #
    # It is a check on an open pull request on purpose. The same condition
    # after the merge is not an error: it is precisely how a docs or hotfix
    # merge declines to cut a release, and `tag and release` handles it by
    # publishing nothing.
    #
    # It runs on every pull request, whatever changed: when the CLI did, it
    # holds lib/release/VERSION and the CLI's version to the rules; when it did not, it
    # says what the merge will publish -- a release with the CLI copied, or
    # nothing.
    name: version bump
    needs: changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: What the merge publishes, and whether the versions allow it
        env:
          GH_TOKEN: ${{ github.token }}
          CLI: ${{ needs.changes.outputs.cli }}
          LATEST: ${{ needs.changes.outputs.latest }}
        # lib/scripts/version-check.sh, so a local rehearsal (make pr-ci)
        # runs the same check.
        run: lib/scripts/version-check.sh --cli "$CLI" --latest "$LATEST"

  clone-llama:
    # Stage one. The script reads the pin from the CLI's third_party build --
    # the one place it lives -- fetches that commit, and checks it resolved.
    name: clone llama.cpp
    # Neither the release after a merge nor a rehearsal of one builds anything.
    # With the CLI unchanged it runs with every step skipped: the builds need
    # it, and see `changes` for why they must still run.
    needs: changes
    if: github.event.action != 'closed' && !inputs.release_rehearsal_pr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.cli == 'true'
      - name: Clone llama.cpp at the pinned commit
        if: needs.changes.outputs.cli == 'true'
        run: lib/scripts/cicd.sh --clone-llama

  unit-tests:
    # Stage one, beside the clone. The SOURCE suite and nothing else: this
    # builds the `apogee_tests` target alone and runs the binary, so no
    # `apogee` executable is produced and ctest never runs.
    #
    # That is the point (user decision, 2026-09-22). tests/CMakeLists.txt
    # registers 34 add_test() entries with ctest, 18 of which spawn the built
    # executable; none of them are compiled into the Catch2 binary. Running
    # that binary directly therefore selects exactly the 1411 source-level
    # cases, without naming a single test to exclude -- and drops the ctest
    # entries with it, including the 16 script checks that needed no
    # executable either.
    #
    # llama.cpp is off: it is most of the compile time, the tests reach the
    # llamacpp backend through its injectable seam rather than the library,
    # and the build stage below still compiles it on every platform.
    name: unit tests ${{ matrix.name }}
    # Every step asks `changes` first: with the CLI unchanged this job runs
    # under its real name and skips the work (see `changes`).
    needs: changes
    if: github.event.action != 'closed' && !inputs.release_rehearsal_pr
    runs-on: ${{ matrix.runner }}
    env:
      APOGEE_CMAKE_ARGS: -DAPOGEE_ENABLE_LLAMA=OFF
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: macos-arm64
            runner: macos-14
          - name: linux-x64
            target: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - name: windows-arm64
            target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.cli == 'true'

      - name: Install libcurl headers (Linux)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      - name: Unit tests
        if: needs.changes.outputs.cli == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --unit-tests --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "unit tests ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Unit tests (MSYS2 shell)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --unit-tests --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "unit tests ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

  build:
    # Stage two. Every build has llama.cpp in it -- APOGEE_ENABLE_LLAMA is ON
    # by default (user decision, 2026-09-19: local inference ships with the
    # tool, so the executable CI builds is the executable a release ships) --
    # which is why stage one proves the pin clones first.
    #
    # fail-fast is off so one failing row does not cancel the others: the PR
    # is blocked either way, and the full picture is worth the runner time.
    #
    # No `if:` of its own: when the stages it needs are skipped -- after a
    # merge, or in a rehearsal -- so is it.
    name: build ${{ matrix.name }}
    # As with the unit tests, every build step asks `changes` first; with the
    # CLI unchanged, the package step copies the platform's archive from the
    # latest release instead of packaging a build.
    needs: [changes, clone-llama, unit-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: macos-arm64
            runner: macos-14
          - name: linux-x64
            target: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - name: windows-arm64
            target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      # Either way: the package action and the scripts live in the checkout.
      - uses: actions/checkout@v5

      - name: Install libcurl headers (Linux)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # `pacboy` prefixes each name for the environment: toolchain:p is
      # mingw-w64-ucrt-x86_64-toolchain in UCRT64 and
      # mingw-w64-clang-aarch64-toolchain in CLANGARM64. curl-winssl is curl
      # built on Schannel -- the platform trust store, which is the whole
      # reason curl is found rather than fetched (cmake/ApogeeDependencies).
      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # git is MSYS2's own (unprefixed): the script opens with
          # `git rev-parse`, and the shell's minimal PATH has no Git for Windows.
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      # Each build step tees its output and, on failure, hands the log to
      # lib/scripts/ci-annotate.sh, which publishes the failure as error
      # annotations: annotations are public on a public repository, the raw
      # log needs admin rights, and a failure that only the owner can read is
      # a failure nobody else can fix.
      - name: Build
        if: needs.changes.outputs.cli == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      # The same command, in the MSYS2 shell the toolchain lives in. The
      # script sees a UCRT64_NT / CLANGARM64_NT host and maps it to Windows.
      - name: Build (MSYS2 shell)
        if: needs.changes.outputs.cli == 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        # The checkout was made by Git for Windows under a different HOME, so
        # MSYS2's git has to be told the tree is safe before the script's
        # first `git rev-parse`.
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      # The archive a release ships, the binary proven to run, and both kept
      # as the artifact `apogee-<target>` -- what `tag and release` publishes
      # once this pull request merges. The same action release.yml packages
      # with. With the CLI unchanged, nothing was built above: the action
      # copies this platform's archive from the latest release instead, into
      # the same artifact, so the run always carries the CLI.
      - name: Package
        uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}
          from-release: ${{ needs.changes.outputs.cli == 'false' && needs.changes.outputs.latest || '' }}

  release:
    # After the merge: the release lib/release/VERSION names, published. Nothing is built
    # -- lib/scripts/release-from-pr.sh decides, against the latest release,
    # whether the CLI changed: if so it takes the pull request's last green
    # run, checks every archive against the merged source tree and the
    # executable against it; if not it copies the latest release's CLI
    # archives. Then it creates the tag `v<VERSION>` at the merge commit
    # together with the release. A version already released publishes
    # nothing.
    #
    # Dispatched with release_rehearsal_pr, the same script runs without
    # --publish: every lookup and check, then what it would have published.
    # Worth doing on a release branch's pull request before merging it.
    #
    # A pull request from a fork gets a read-only token, so its merge cannot
    # publish; releases come from this repository's own version branches.
    name: tag and release
    if: >-
      (github.event.action == 'closed' && github.event.pull_request.merged)
      || inputs.release_rehearsal_pr
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tag and the release
      actions: read     # the pull request's CI runs and their artifacts
    steps:
      # The merge commit, which carries the script; a rehearsal runs the
      # script from the branch it was dispatched on. The whole history: the
      # CLI is compared with the latest release's commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.release_rehearsal_pr }}
          PUBLISH: ${{ github.event_name == 'pull_request' && '--publish' || '' }}
        run: lib/scripts/release-from-pr.sh "$PR" $PUBLISH
