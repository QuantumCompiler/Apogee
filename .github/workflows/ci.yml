# Apogee CI.
#
# Every build job shells out to lib/scripts/cicd.sh — the same script a
# developer runs locally. That is deliberate: the moment CI grows its own build
# steps, "works on my machine" becomes a real answer. If a step belongs in CI,
# it belongs in that script.
#
# This workflow must live at .github/workflows/ (GitHub's requirement), which is
# why it is the one build-related file not under lib/src/cli/. It stays a thin
# caller for exactly that reason: the CLI's build lives with the CLI.
#
# Gating policy (user decision, 2026-09-19, superseding 2026-08-24's
# "macos-arm64 only"): EVERY job here is required for a pull request -- the
# clone and all five builds. There is no `continue-on-error`
# in this file and there must not be one; a platform that cannot pass is a
# platform to fix, not to mark informational. GitHub enforces the requirement
# through the branch protection rule on `stable`, which lists these checks by
# their job names (`clone llama.cpp`, `build <name>`) -- a renamed job has to
# be renamed there too.
#
# Job policy (user decisions, 2026-09-19, 2026-09-20 and 2026-09-22): CI is the
# llama.cpp clone, the suite per platform, then one executable build per
# platform -- five of them, the Intel Mac having been dropped -- and nothing
# else -- plus one pull-request-only check, `version bump`, which exists
# because a merge to `stable` now publishes a release and a forgotten version
# bump would otherwise merge and publish nothing, silently.
# The suite RUNS here again as of 2026-09-22, reversing 2026-09-20's
# "remove the tests from the CI/CD"; `make test` remains the developer's gate
# before a push, and this is the same gate enforced where it cannot be skipped.
# Formatting, clang-tidy, install parity and the clean-room build are LOCAL
# gates still — `make format-check`, `make lint`, the `cli.install_parity` case
# in the suite, and `cicd.sh --fresh` — not jobs here; the dedicated jobs for
# them were removed on 2026-09-19 as work the build itself already covers.
#
# Shape (user decisions, 2026-09-19, 2026-09-20 and 2026-09-22): three stages,
# each a call into cicd.sh.
#
#   1. clone llama.cpp   -- prove the pin resolves. llama.cpp ships with the
#                           tool, so a pin that no longer clones is a broken
#                           product, and no platform is worth building on it.
#   1. test <platform>   -- the suite on its own native runner, built WITHOUT
#                           llama.cpp. Runs beside stage 1, not after it.
#   2. build <platform>  -- one job per platform, llama.cpp linked in like
#                           every build (it ships with the tool).
#
# `build` needs BOTH of the first two; those two have no edge between them,
# because a test build with llama.cpp off never consults the pin. That
# ordering is the point of the stage: the five builds cost ~82 minutes of
# runner time, and a commit whose tests fail should never spend it.
#
# Why llama.cpp is OFF for the suite (user decision, 2026-09-22): it is most
# of the compile time, and nothing carries between jobs -- so a test stage
# that built it would rebuild, in full, everything stage 2 then rebuilds,
# roughly doubling CI for a gate whose job is to fail fast. The cost is
# real and named: the llamacpp backend answers "not built in", so its own
# cases do not run here. Stage 2 still compiles it on every platform, so a
# break in llama.cpp itself is caught one stage later rather than never.
#
# This is the second attempt at a suite stage. The first (2026-09-20) ran it
# on the build tree handed over from stage 2 as an artifact, and was removed
# the same day: it could only run AFTER the builds it was supposed to gate,
# which is the wrong order and the expensive one. This one builds its own
# tree, cheaply, in front of them.
#
# What a runner needs beyond its image, per platform: the Linux images ship no
# libcurl headers (`find_package(CURL REQUIRED)` is the first hard lookup, and
# the whole configure fell over on it five seconds in); the Windows images ship
# MSYS2 pre-installed but off PATH, and the Windows build is a MinGW-w64 one
# (user decision, 2026-09-19) -- GCC in the UCRT64 environment on x64, clang in
# CLANGARM64 on arm64 -- so msys2/setup-msys2 puts the toolchain, cmake, ninja,
# pkgconf and MSYS2's Schannel curl in that shell and the build step runs
# inside it; macOS has curl in the SDK. Every runner passes --no-defer, so a
# misdetected host is a failure rather than the silent "deferred to CI"
# success it once was.

name: CI

# Trigger policy (user decision, 2026-08-31): a run starts on a PROPOSED merge,
# on a COMPLETED merge, or ON REQUEST -- and never on an ordinary push, so
# work-in-progress commits on a branch with no PR open cost nothing:
#
#   pull_request       reviewing a merge before it happens (the gating one)
#   push: [stable]     the merge itself, plus any direct push to stable
#   workflow_dispatch  gh workflow run CI --ref <branch>
#
# The two branch lists are the same list on purpose: they name the integration
# branches. Adding one means adding it BOTH places -- a PR into `v0.1.0`, or a
# merge into it, triggers nothing while only `stable` is listed.
#
# These two do not double up. `pull_request` fires for the topic branch's PR;
# `push` fires only for `stable`, which no topic branch is. (The combination
# that double-fires is `push: ["**"]` with `pull_request`, which is what this
# file used to have.)
#
# Fork PRs run with a read-only token and no secrets. Nothing here needs a
# secret, so they work -- keep it that way.
#
# Note the GitHub constraint the dispatch half depends on: workflow_dispatch is
# only offered for a workflow that exists on the repository's DEFAULT branch
# (`stable`). Deleting this file from `stable`, or renaming it there, removes
# the on-request half entirely. The dispatch reads the trigger list from
# `stable` but RUNS the workflow file from the ref you select, so per-branch job
# changes still apply.
on:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    # A merge into `stable` publishes a release, and what it publishes is
    # decided by `project(... VERSION x.y.z)` in lib/src/cli/CMakeLists.txt
    # (user decision, 2026-09-22). A PR that forgets to bump it therefore
    # merges cleanly and then releases NOTHING -- a silent no-op that looks
    # exactly like a deliberate skip, and is only noticed by its absence.
    # This job makes that case loud at review time instead.
    #
    # It is a pull_request-only check on purpose. The same condition on a push
    # to `stable` is not an error: it is precisely how a docs or hotfix merge
    # declines to cut a release, and release.yml's gate handles it by doing
    # nothing.
    name: version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The version must not already be released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="v$(sed -n 's/^[[:space:]]*VERSION[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' lib/src/cli/CMakeLists.txt | head -1)"
          if [ "$version" = "v" ]; then
            echo "::error file=lib/src/cli/CMakeLists.txt::could not read VERSION"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "::error file=lib/src/cli/CMakeLists.txt::$version is already released -- bump project(... VERSION x.y.z) or this merge will publish nothing"
            exit 1
          fi
          echo "$version is unreleased; merging this PR will publish it" >> "$GITHUB_STEP_SUMMARY"

  clone-llama:
    # Stage one. The script reads the pin from the CLI's third_party build --
    # the one place it lives -- fetches that commit, and checks it resolved.
    name: clone llama.cpp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Clone llama.cpp at the pinned commit
        run: lib/scripts/cicd.sh --clone-llama

  test:
    # Stage one-and-a-half. The suite on its own native runner, one job per
    # platform, built WITHOUT llama.cpp -- the `make no-llama` configuration,
    # reached here through the script's documented APOGEE_CMAKE_ARGS seam
    # rather than a CI-only build step.
    #
    # `cicd.sh --test` runs ctest only when the target it built IS the host,
    # which on a native runner is always true. That is also why there is one
    # row per platform instead of one job: a cross-built test binary cannot
    # run, so "test everywhere" means "a runner everywhere".
    #
    # No continue-on-error, per this file's gating policy: a platform whose
    # tests cannot pass is a platform to fix. NOTE that the Windows rows are
    # the first time the suite has ever run on a Windows runner -- the
    # portability gaps recorded in release.yml (PTY, tcflush, lsof, 0600
    # modes) are real, and if they surface it is as a failing check here.
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      APOGEE_CMAKE_ARGS: -DAPOGEE_ENABLE_LLAMA=OFF
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: macos-arm64
            runner: macos-14
          - name: linux-x64
            target: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - name: windows-arm64
            target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@v5

      - name: Install libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      # Same annotate-on-failure contract as the build steps: a failing case
      # has to be readable without admin rights on the repository.
      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --test --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "test ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Test (MSYS2 shell)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --test --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "test ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

  build:
    # Stage two. Every build has llama.cpp in it -- APOGEE_ENABLE_LLAMA is ON
    # by default (user decision, 2026-09-19: local inference ships with the
    # tool, so the executable CI builds is the executable a release ships) --
    # which is why stage one proves the pin clones first.
    #
    # fail-fast is off so one failing row does not cancel the others: the PR
    # is blocked either way, and the full picture is worth the runner time.
    name: build ${{ matrix.name }}
    # Both first-stage gates: the pin resolves, and the suite passes on every
    # platform. Neither costs a build of llama.cpp, so the ~82 minutes of
    # builds below only start once the cheap checks have agreed.
    needs: [clone-llama, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: macos-arm64
            runner: macos-14
          - name: linux-x64
            target: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            target: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - name: windows-arm64
            target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@v5

      - name: Install libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # `pacboy` prefixes each name for the environment: toolchain:p is
      # mingw-w64-ucrt-x86_64-toolchain in UCRT64 and
      # mingw-w64-clang-aarch64-toolchain in CLANGARM64. curl-winssl is curl
      # built on Schannel -- the platform trust store, which is the whole
      # reason curl is found rather than fetched (cmake/ApogeeDependencies).
      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # git is MSYS2's own (unprefixed): the script opens with
          # `git rev-parse`, and the shell's minimal PATH has no Git for Windows.
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      # Each build step tees its output and, on failure, hands the log to
      # lib/scripts/ci-annotate.sh, which publishes the failure as error
      # annotations: annotations are public on a public repository, the raw
      # log needs admin rights, and a failure that only the owner can read is
      # a failure nobody else can fix.
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      # The same command, in the MSYS2 shell the toolchain lives in. The
      # script sees a UCRT64_NT / CLANGARM64_NT host and maps it to Windows.
      - name: Build (MSYS2 shell)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # The checkout was made by Git for Windows under a different HOME, so
        # MSYS2's git has to be told the tree is safe before the script's
        # first `git rev-parse`.
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.name }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }
