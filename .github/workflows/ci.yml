# Apogee CI.
#
# Every build job shells out to lib/scripts/cicd.sh — the same script a
# developer runs locally. That is deliberate: the moment CI grows its own build
# steps, "works on my machine" becomes a real answer. If a step belongs in CI,
# it belongs in that script.
#
# This workflow must live at .github/workflows/ (GitHub's requirement), which is
# why it is the one build-related file not under lib/src/cli/. It stays a thin
# caller for exactly that reason: the CLI's build lives with the CLI.
#
# Gating policy (user decision, 2026-08-24): macos-arm64 is the only
# merge-blocking target for v0.1.0. The other five run informationally while
# portability catches up, and get promoted to blocking as they stabilize —
# promote one by deleting its `continue-on-error` line.

name: CI

# Trigger policy (user decision, 2026-08-31): a run starts on a PROPOSED merge,
# on a COMPLETED merge, or ON REQUEST -- and never on an ordinary push, so
# work-in-progress commits on a branch with no PR open cost nothing:
#
#   pull_request       reviewing a merge before it happens (the gating one)
#   push: [stable]     the merge itself, plus any direct push to stable
#   workflow_dispatch  gh workflow run CI --ref <branch>
#
# The two branch lists are the same list on purpose: they name the integration
# branches. Adding one means adding it BOTH places -- a PR into `v0.1.0`, or a
# merge into it, triggers nothing while only `stable` is listed.
#
# These two do not double up. `pull_request` fires for the topic branch's PR;
# `push` fires only for `stable`, which no topic branch is. (The combination
# that double-fires is `push: ["**"]` with `pull_request`, which is what this
# file used to have.)
#
# On `pull_request`, note what the ref is: GitHub checks out the PR's synthetic
# merge ref and sets GITHUB_REF_NAME to `<number>/merge`. That is not a branch
# on the remote, which is why the fresh-clone job below opts out of PR runs
# rather than trying to clone it. It is also why the completed-merge half is a
# push trigger and not `pull_request: [closed]`.
#
# Fork PRs run with a read-only token and no secrets. Nothing here needs a
# secret, so they work -- keep it that way.
#
# Note the GitHub constraint the dispatch half depends on: workflow_dispatch is
# only offered for a workflow that exists on the repository's DEFAULT branch
# (`stable`). Deleting this file from `stable`, or renaming it there, removes
# the on-request half entirely. The dispatch reads the trigger list from
# `stable` but RUNS the workflow file from the ref you select, so per-branch job
# changes still apply.
on:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.blocking != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            blocking: true
          - target: macos-x64
            runner: macos-13
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-x64
            runner: windows-2022
          - target: windows-arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: bash
        run: lib/scripts/cicd.sh --platform ${{ matrix.target }} --test

  lint:
    name: format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tooling
        run: sudo apt-get update && sudo apt-get install -y clang clang-format clang-tidy

      - name: Check formatting
        run: make -C lib/src/cli format-check

      # The ownership gate: this fails on a raw new/delete or an owning raw
      # pointer anywhere in the CLI's source/ or tests/ (CLAUDE.md -> Code
      # Style). third_party/ is out of scope by construction.
      - name: Lint
        run: make -C lib/src/cli lint

  llama:
    # The local-inference configuration. Non-blocking because the Metal/CUDA
    # kernel build is slow; it catches a pin that stops compiling, and — since
    # llamacpp-backend shipped 2026-08-31 — that the real LlamaRuntime still
    # matches llama.cpp's API at the pinned commit.
    # The default build compiles the "not built in" half of that file, so this
    # job is the ONLY place the vendor calls are checked at all.
    name: llama.cpp integration (non-blocking)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build with llama.cpp enabled
        working-directory: lib/src/cli
        run: |
          cmake --preset macos-arm64 -DAPOGEE_ENABLE_LLAMA=ON
          cmake --build build/macos-arm64 -j 3
      - name: Test, including the no-listen invariant with llama.cpp linked
        working-directory: lib/src/cli
        # The invariant this configuration puts at risk: llama.cpp's code now
        # runs INSIDE the binary that serves an interactive turn, so the symbol
        # scan of the linked executable is the check that matters most here.
        run: ctest --test-dir build/macos-arm64 --output-on-failure

  install-parity:
    # The install-parity gate on the platform whose installer is bash.
    #
    # Ommi's dominant early bug class was silent install drift: each install
    # path seeded a slightly different tree and nothing failed loudly. The
    # structural fix is one layout declaration (source/harness/layout.h); this
    # job is what keeps it honest, and `tests/install_parity.sh` explains why
    # every exception is where the next drift hides.
    name: install parity (posix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: lib/scripts/cicd.sh --platform linux-x64
      - name: Two installs, identical trees
        run: |
          lib/src/cli/tests/install_parity.sh \
            lib/src/cli/build/linux-x64/source/apogee \
            "$RUNNER_TEMP/install-parity"
      - name: make install produces the same tree
        # The developer path, end to end, against a throwaway prefix and home.
        # `make install` finishes with `apogee check --fix`, so this asserts the
        # whole chain rather than just the binary landing.
        run: |
          export APOGEE_HOME="$RUNNER_TEMP/make-home"
          make -C lib/src/cli install PREFIX="$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/apogee" check
          diff \
            <(cd "$RUNNER_TEMP/make-home" && find . -type d | LC_ALL=C sort) \
            <(cd "$RUNNER_TEMP/install-parity/a" && find . -type d | LC_ALL=C sort)

  install-parity-windows:
    # Windows ships binaries from the first tagged release (user decision,
    # 2026-09-01), so its installer is a parity path like any other and gets the
    # same comparison expressed in PowerShell.
    #
    # Non-blocking, and honestly so: Apogee's Windows portability work is
    # incomplete -- the PTY tests, tcflush typeahead flush, lsof no-listen poll,
    # and 0600 modes have no Windows equivalent yet, and `apogee check` reports
    # the mode rows as SKIPPED there rather than passing them. A Windows install
    # is therefore verified more weakly than a POSIX one, and that is visible in
    # the check output rather than implied.
    name: install parity (windows, non-blocking)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: lib/scripts/cicd.sh --platform windows-x64
      - name: Two installs, identical trees
        shell: pwsh
        run: |
          $exe = "lib/src/cli/build/windows-x64/source/apogee.exe"
          if (-not (Test-Path $exe)) { $exe = "lib/src/cli/build/windows-x64/source/Release/apogee.exe" }
          foreach ($root in @("$env:RUNNER_TEMP\pa", "$env:RUNNER_TEMP\pb")) {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            $env:APOGEE_HOME = $root
            & $exe check --fix | Out-Null
          }
          $a = Get-ChildItem "$env:RUNNER_TEMP\pa" -Recurse -Directory |
               ForEach-Object { $_.FullName.Replace("$env:RUNNER_TEMP\pa", '') } | Sort-Object
          $b = Get-ChildItem "$env:RUNNER_TEMP\pb" -Recurse -Directory |
               ForEach-Object { $_.FullName.Replace("$env:RUNNER_TEMP\pb", '') } | Sort-Object
          if (Compare-Object $a $b) {
            Write-Error "INSTALL PARITY VIOLATED: the two install paths produce different trees"
            exit 1
          }
          if ($a.Count -lt 5) {
            Write-Error "INSTALL PARITY: only $($a.Count) directories seeded -- would pass vacuously"
            exit 1
          }
          # A freshly seeded install must pass its own doctor.
          $env:APOGEE_HOME = "$env:RUNNER_TEMP\pa"
          & $exe check
          if ($LASTEXITCODE -ne 0) { Write-Error "a fresh install does not pass 'apogee check'"; exit 1 }
          Write-Host "install parity: $($a.Count) directories, identical - OK"

  fresh-clone:
    # The scripted clean-room check, so the skeleton cannot silently rot: it
    # clones the branch from scratch and builds it with nothing cached.
    #
    # It clones from the REMOTE, so it proves what is pushed, not what a runner
    # checked out -- dispatching a branch with unpushed commits tests the older
    # state, silently and successfully.
    #
    # Excluded from PR runs, and the exclusion is load-bearing rather than a
    # cost saving: on `pull_request` GITHUB_REF_NAME is `<number>/merge`, and
    # `cicd.sh --fresh --branch` hands that to `git clone --branch`, which
    # resolves refs/heads and refs/tags only -- never refs/pull. Every PR run
    # would fail here. A fork's head branch is not on this remote at all, which
    # is the second reason. Written as != 'pull_request' so a dispatch still
    # runs it; `== 'push'` would silently disable it for dispatches.
    name: clean-room build (non-blocking)
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fresh clone-and-build
        run: lib/scripts/cicd.sh --fresh --branch "${GITHUB_REF_NAME}" --test
