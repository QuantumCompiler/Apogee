# Apogee releases.
#
# Distribution host and pipeline shape are a user decision (2026-09-01): GitHub
# Releases, built by GitHub Actions. A pushed tag builds every target on its own
# native runner and uploads one archive per target; `install.sh` and
# `install.ps1` then fetch the archive for the host.
#
# **It builds through lib/scripts/cicd.sh, like every other job here.** The item
# asked for that by name, and the reason is the same one the CI workflow gives:
# the moment a release grows its own build steps, a release binary can differ
# from a tested one in ways nobody can reproduce locally.
#
# **Every target ships from the first tag** (user decision, 2026-09-01),
# Windows included -- five since 2026-09-19, when the Intel Mac was dropped. Recorded caveat, because it is real: Apogee's Windows
# portability work is incomplete -- the PTY tests, the tcflush typeahead flush,
# the lsof no-listen poll, and 0600 file modes have no Windows equivalent yet,
# and `apogee check` reports the mode rows as SKIPPED there rather than passing
# them. A Windows build is verified more weakly than a POSIX one. That is why
# `windows-*` is not `blocking` below: a Windows failure must not silently
# withhold the five targets that ARE fully verified.
#
# Nothing here signs anything. macOS ships unsigned (user decision, 2026-09-01):
# a curl-driven install sets no quarantine attribute, and for the browser
# download case `apogee check` detects the attribute and prints the exact
# `xattr -d` command. Notarization joins when there is a Developer ID.

name: Release

on:
  push:
    # A merge into `stable` IS a release (user decision, 2026-09-22). That is
    # the branch convention stated plainly: development happens on a
    # version-named branch and merges here when that release is done. What
    # decides is `project(... VERSION x.y.z)` in lib/src/cli/CMakeLists.txt --
    # already the one place the version lives -- so a merge whose version has
    # been released publishes nothing, and docs or hotfix merges to `stable`
    # need no exception rule to stay quiet.
    branches: [stable]
    # The manual path, kept as the escape hatch: `make release` pushes a tag,
    # and so can a person. Both paths meet in the same `gate` job below.
    tags:
      - "v*"
  # A dry run, so the pipeline can be exercised without cutting a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  gate:
    # What version is this, and should it ship? Both triggers land here, and
    # this is the only job that answers either question.
    #
    # The idempotency key is the RELEASE, not the tag. That distinction is what
    # lets one job serve both paths: on a tag push the tag necessarily exists
    # already (pushing it is what started the run) while the release does not,
    # and on a repeat push to `stable` both exist and nothing should happen.
    #
    # On the tag path this also enforces the guard the pipeline never had: a
    # tag whose name disagrees with CMakeLists.txt fails HERE, before five
    # runners spend ~82 minutes building a binary that would misreport its own
    # version. `make release` checks the same thing locally; this is the copy
    # that a hand-pushed tag cannot skip.
    name: gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      exists: ${{ steps.decide.outputs.exists }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide the version and whether it ships
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The one source of the version, read the same way make release reads it.
          cmake_version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' lib/src/cli/CMakeLists.txt | head -1)"
          [ -n "$cmake_version" ] || { echo "::error::could not read VERSION from lib/src/cli/CMakeLists.txt"; exit 1; }

          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF_NAME}"
              if [ "$version" != "v${cmake_version}" ]; then
                echo "::error::tag ${version} disagrees with CMakeLists.txt VERSION ${cmake_version}; the release would ship a binary reporting ${cmake_version}"
                exit 1
              fi
              proceed=pending
              ;;
            *)
              version="v${cmake_version}"
              proceed=pending
              ;;
          esac

          if gh release view "$version" >/dev/null 2>&1; then exists=true; else exists=false; fi

          # A dispatch always builds, so a dry run is never silently skipped.
          # Every other path builds only when this version has not shipped --
          # including a re-pushed tag, which would otherwise spend the full
          # matrix on a release that publish would then refuse to overwrite.
          if [ "$proceed" = "pending" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then proceed=true;
            elif [ "$exists" = "true" ]; then proceed=false;
            else proceed=true; fi
          fi

          {
            echo "version=$version"
            echo "exists=$exists"
            echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"

          echo "### Release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| version | \`$version\` (CMakeLists.txt: $cmake_version) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| already released | $exists |" >> "$GITHUB_STEP_SUMMARY"
          echo "| building | $proceed |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$proceed" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to do: \`$version\` is already published. Bump \`project(... VERSION x.y.z)\` in \`lib/src/cli/CMakeLists.txt\` to cut the next one." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.blocking != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            blocking: true
          - target: linux-x64
            runner: ubuntu-24.04
            blocking: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            blocking: true
          - target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@v5

      # The same per-platform prerequisites as CI (ci.yml says why): libcurl
      # headers on Linux; on Windows the MinGW-w64 toolchain, cmake, ninja,
      # pkgconf and the Schannel curl in an MSYS2 shell, where the build runs.
      - name: Install libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # git is MSYS2's own (unprefixed): the script opens with
          # `git rev-parse`, and the shell's minimal PATH has no Git for Windows.
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      # Builds AND runs the suite, in that order, in one job (user decision,
      # 2026-09-22). `--test` costs no second compile -- ctest runs against the
      # tree this step just produced -- so the executable that gets packaged
      # below is the exact one the tests just passed against, llama.cpp
      # included. A failing case fails the job, and `publish` needs every
      # blocking row, so a release cannot outrun its own tests. On failure
      # lib/scripts/ci-annotate.sh publishes the log as error annotations,
      # readable through the public API without admin rights (ci.yml says why).
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --test --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Build (MSYS2 shell)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # The checkout was made by Git for Windows under a different HOME, so
        # MSYS2's git has to be told the tree is safe before the script's
        # first `git rev-parse`.
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --test --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Stage the archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/completions"

          # The binary, wherever this generator put it.
          binary=""
          for candidate in \
            "lib/src/cli/build/${{ matrix.target }}/source/apogee" \
            "lib/src/cli/build/${{ matrix.target }}/source/apogee.exe" \
            "lib/src/cli/build/${{ matrix.target }}/source/Release/apogee.exe"; do
            if [ -f "$candidate" ]; then binary="$candidate"; break; fi
          done
          [ -n "$binary" ] || { echo "no binary built for ${{ matrix.target }}" >&2; exit 1; }
          cp "$binary" "$stage/"

          # Completions ride along: they are part of the install contract, so
          # they ship in the same archive rather than being fetched separately.
          cp lib/src/cli/completions/* "$stage/completions/"

          case "${{ matrix.target }}" in
            windows-*) (cd "$stage" && 7z a -tzip "$RUNNER_TEMP/apogee-${{ matrix.target }}.zip" .) ;;
            *)         tar -czf "$RUNNER_TEMP/apogee-${{ matrix.target }}.tar.gz" -C "$stage" . ;;
          esac

      # Proof the artifact RUNS, not merely that a file exists -- the item's
      # Core constraint: "distributed binaries are verified by RUNNING them
      # post-install". A staged binary that cannot start is exactly what a file
      # listing cannot tell you. This step runs OUTSIDE the MSYS2 shell on
      # Windows on purpose: a user's machine has no MSYS2, and the preset's
      # static link is what makes the executable start there -- this is where
      # that is proven.
      - name: Verify the staged binary runs
        shell: bash
        run: |
          set -euo pipefail
          export APOGEE_HOME="$RUNNER_TEMP/verify-home"
          exe="$RUNNER_TEMP/stage/apogee"
          [ -f "$exe" ] || exe="$RUNNER_TEMP/stage/apogee.exe"
          "$exe" version
          "$exe" check --fix
          "$exe" check

      # v7, not v4: v4 and v5 still default to the Node 20 runtime, which the
      # runners deprecated on 2025-09-19 and now force onto Node 24 with a
      # warning. v6 was the version that declared `runs.using: node24`; v7 is
      # current. `archive` still defaults to true, so the upload is zipped
      # exactly as before -- the only change here is the runtime.
      - uses: actions/upload-artifact@v7
        with:
          name: apogee-${{ matrix.target }}
          path: ${{ runner.temp }}/apogee-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [gate, build]
    runs-on: ubuntu-24.04
    # `exists` is re-checked here and not only in the gate: the gate's answer
    # is minutes old by now, and two runs racing to publish the same version
    # should lose the race, not overwrite each other.
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.exists != 'true' && inputs.dry_run != true
    steps:
      - uses: actions/checkout@v5

      # v8 for the same Node 24 reason (v7 was the runtime bump). Two v8
      # behaviours are worth knowing here and both are wanted: a digest
      # mismatch now FAILS the download instead of logging a warning
      # (`digest-mismatch` defaults to `error`), which is what a pipeline that
      # publishes binaries should do rather than shipping a corrupt asset; and
      # decompression is decided per file by Content-Type, which unzips these
      # artifacts as before because they are uploaded archived.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # One call makes the tag AND the release, which is why nothing earlier in
      # this workflow pushes a tag. A blocking build failure therefore leaves
      # NOTHING behind to clean up -- no orphaned tag whose release never came,
      # which is the state that otherwise has to be unpicked by hand before a
      # retry. `--target` is the commit under test: the merge commit on a push
      # to `stable`, the tagged commit on a tag push (where the tag already
      # exists and `--target` is simply ignored).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --generate-notes \
            artifacts/*
          echo "published ${VERSION} at ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
