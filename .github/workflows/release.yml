# Apogee releases.
#
# Distribution host and pipeline shape are a user decision (2026-09-01): GitHub
# Releases, built by GitHub Actions. A pushed tag builds every target on its own
# native runner and uploads one archive per target; `install.sh` and
# `install.ps1` then fetch the archive for the host.
#
# **It builds through lib/scripts/cicd.sh, like every other job here.** The item
# asked for that by name, and the reason is the same one the CI workflow gives:
# the moment a release grows its own build steps, a release binary can differ
# from a tested one in ways nobody can reproduce locally.
#
# **All six targets ship from the first tag** (user decision, 2026-09-01),
# Windows included. Recorded caveat, because it is real: Apogee's Windows
# portability work is incomplete -- the PTY tests, the tcflush typeahead flush,
# the lsof no-listen poll, and 0600 file modes have no Windows equivalent yet,
# and `apogee check` reports the mode rows as SKIPPED there rather than passing
# them. A Windows build is verified more weakly than a POSIX one. That is why
# `windows-*` is not `blocking` below: a Windows failure must not silently
# withhold the five targets that ARE fully verified.
#
# Nothing here signs anything. macOS ships unsigned (user decision, 2026-09-01):
# a curl-driven install sets no quarantine attribute, and for the browser
# download case `apogee check` detects the attribute and prints the exact
# `xattr -d` command. Notarization joins when there is a Developer ID.

name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run, so the pipeline can be exercised without cutting a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.blocking != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            blocking: true
          - target: macos-x64
            runner: macos-13
            blocking: true
          - target: linux-x64
            runner: ubuntu-24.04
            blocking: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            blocking: true
          - target: windows-x64
            runner: windows-2022
          - target: windows-arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      # Tests run before an artifact is produced. A release binary that was
      # never tested is the one thing a release pipeline must not emit.
      - name: Build and test
        shell: bash
        run: lib/scripts/cicd.sh --platform ${{ matrix.target }} --test

      - name: Stage the archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/completions"

          # The binary, wherever this generator put it.
          binary=""
          for candidate in \
            "lib/src/cli/build/${{ matrix.target }}/source/apogee" \
            "lib/src/cli/build/${{ matrix.target }}/source/apogee.exe" \
            "lib/src/cli/build/${{ matrix.target }}/source/Release/apogee.exe"; do
            if [ -f "$candidate" ]; then binary="$candidate"; break; fi
          done
          [ -n "$binary" ] || { echo "no binary built for ${{ matrix.target }}" >&2; exit 1; }
          cp "$binary" "$stage/"

          # Completions ride along: they are part of the install contract, so
          # they ship in the same archive rather than being fetched separately.
          cp lib/src/cli/completions/* "$stage/completions/"

          case "${{ matrix.target }}" in
            windows-*) (cd "$stage" && 7z a -tzip "$RUNNER_TEMP/apogee-${{ matrix.target }}.zip" .) ;;
            *)         tar -czf "$RUNNER_TEMP/apogee-${{ matrix.target }}.tar.gz" -C "$stage" . ;;
          esac

      # Proof the artifact RUNS, not merely that a file exists -- the item's
      # Core constraint: "distributed binaries are verified by RUNNING them
      # post-install". A staged binary that cannot start is exactly what a file
      # listing cannot tell you.
      - name: Verify the staged binary runs
        if: ${{ !startsWith(matrix.target, 'windows-arm64') }}
        shell: bash
        run: |
          set -euo pipefail
          export APOGEE_HOME="$RUNNER_TEMP/verify-home"
          exe="$RUNNER_TEMP/stage/apogee"
          [ -f "$exe" ] || exe="$RUNNER_TEMP/stage/apogee.exe"
          "$exe" version
          "$exe" check --fix
          "$exe" check

      - uses: actions/upload-artifact@v4
        with:
          name: apogee-${{ matrix.target }}
          path: ${{ runner.temp }}/apogee-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
