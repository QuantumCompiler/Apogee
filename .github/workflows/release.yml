# Apogee releases -- the MANUAL path.
#
# Distribution host and pipeline shape are a user decision (2026-09-01): GitHub
# Releases, built by GitHub Actions. `install.sh` and `install.ps1` fetch the
# archive for the host from there.
#
# **The everyday release is not this file** (user decision, 2026-09-25): a
# merge into `stable` no longer runs it. ci.yml's `tag and release` job
# publishes the merged pull request's OWN archives -- the ones its CI run
# built and proved -- tagged with the version the executable reports
# (lib/scripts/release-from-pr.sh). What remains here is the escape hatch: a
# hand-pushed `v*` tag (`make -C lib/src/cli release`) builds every target
# from that tag and publishes, for a re-cut or for when the merged pull
# request's archives cannot be used; and the dry-run dispatch.
#
# One deliberate difference from the merge path: this path always REBUILDS the
# CLI from the tag, even when it is unchanged since the latest release, where
# the merge path would copy that release's archives (user decision,
# 2026-09-25). It is the escape hatch -- a re-cut, or a merge whose archives
# could not be used -- and "build it again from source" is what an escape
# hatch is for. The release it names is still `VERSION`, never the CLI's own
# version.
#
# The tag that `tag and release` creates does NOT start this workflow: a tag
# made with a run's GITHUB_TOKEN triggers no workflow, which is what keeps a
# merge from publishing twice.
#
# **It builds through lib/scripts/cicd.sh, like every other job here.** The item
# asked for that by name, and the reason is the same one the CI workflow gives:
# the moment a release grows its own build steps, a release binary can differ
# from a tested one in ways nobody can reproduce locally.
#
# **Every target ships from the first tag** (user decision, 2026-09-01),
# Windows included -- five since 2026-09-19, when the Intel Mac was dropped.
# Recorded caveat, because it is real: Apogee's Windows portability work is
# incomplete -- the PTY tests, the tcflush typeahead flush, the lsof no-listen
# poll, and 0600 file modes have no Windows equivalent yet, and `apogee check`
# reports the mode rows as SKIPPED there rather than passing them. A Windows
# build is verified more weakly than a POSIX one. That is why `windows-*` is
# not `blocking` below: a Windows failure must not withhold the three POSIX
# targets that ARE fully verified. (The merge path has no such asymmetry: CI
# requires all five builds, so a merged pull request always has five archives.)
#
# Nothing here signs anything. macOS ships unsigned (user decision, 2026-09-01):
# a curl-driven install sets no quarantine attribute, and for the browser
# download case `apogee check` detects the attribute and prints the exact
# `xattr -d` command. Notarization joins when there is a Developer ID.

name: Release

on:
  push:
    # The manual path, kept as the escape hatch: `make release` pushes a tag,
    # and so can a person. Both it and the dispatch meet in the `gate` job.
    # Not `branches: [stable]` (user decision, 2026-09-25): a merge publishes
    # through ci.yml's `tag and release`, from the pull request's archives.
    tags:
      - "v*"
  # A dry run, so the pipeline can be exercised without cutting a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not publish a release"
        type: boolean
        default: true

# One release at a time, and never cancelled. `cancel-in-progress: false` is
# the opposite of CI's setting and deliberate: a superseded CI run is waste,
# but a half-finished release is a tag, a release object, or a set of assets
# in a state nobody asked for. A second run queues behind the first and then
# finds the version already published, which is the outcome that needs no
# cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # What version is this, and should it ship? Both triggers land here, and
    # this is the only job that answers either question.
    #
    # The idempotency key is the RELEASE, not the tag: on a tag push the tag
    # necessarily exists already (pushing it is what started the run) while
    # the release does not.
    #
    # On the tag path this also enforces the guard the pipeline never had: a
    # tag whose name disagrees with VERSION -- the release, since 2026-09-25;
    # the CLI keeps its own version in its CMakeLists -- fails HERE, before
    # five runners spend ~82 minutes building. `make release` checks the same
    # thing locally; this is the copy that a hand-pushed tag cannot skip.
    name: gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      exists: ${{ steps.decide.outputs.exists }}
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide the version and whether it ships
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The release, as VERSION names it -- read the same way make release,
          # version-check.sh and release-from-pr.sh read it.
          release_version="$(tr -d ' \r\n' < VERSION)"
          echo "$release_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "::error file=VERSION::VERSION must hold the release as x.y.z (got '$release_version')"; exit 1; }

          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF_NAME}"
              if [ "$version" != "v${release_version}" ]; then
                echo "::error::tag ${version} disagrees with VERSION ${release_version}; bump VERSION, or tag v${release_version}"
                exit 1
              fi
              proceed=pending
              ;;
            *)
              version="v${release_version}"
              proceed=pending
              ;;
          esac

          if gh release view "$version" >/dev/null 2>&1; then exists=true; else exists=false; fi

          # A dispatch always builds, so a dry run is never silently skipped.
          # Every other path builds only when this version has not shipped --
          # including a re-pushed tag, which would otherwise spend the full
          # matrix on a release that publish would then refuse to overwrite.
          if [ "$proceed" = "pending" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then proceed=true;
            elif [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then proceed=true;
            elif [ "$exists" = "true" ]; then proceed=false;
            else proceed=true; fi
          fi

          {
            echo "version=$version"
            echo "exists=$exists"
            echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"

          echo "### Release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| version | \`$version\` (VERSION: $release_version) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| already released | $exists |" >> "$GITHUB_STEP_SUMMARY"
          echo "| building | $proceed |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$proceed" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to do: \`$version\` is already published. Bump \`VERSION\` to cut the next one." >> "$GITHUB_STEP_SUMMARY"
          fi

  unit-tests:
    # The same source-level gate CI runs, in front of the release builds
    # (user decision, 2026-09-22). A hand-pushed tag can name a commit no CI
    # run ever tested, so this path gates itself rather than trusting that one
    # did. The stage is cheap -- one target, llama.cpp off, no executable --
    # which is what makes paying for it a second time reasonable.
    name: unit tests ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      APOGEE_CMAKE_ARGS: -DAPOGEE_ENABLE_LLAMA=OFF
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            blocking: true
          - target: linux-x64
            runner: ubuntu-24.04
            blocking: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            blocking: true
          - target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    continue-on-error: ${{ matrix.blocking != true }}
    steps:
      - uses: actions/checkout@v5

      - name: Install libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      - name: Unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --unit-tests --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "unit tests ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Unit tests (MSYS2 shell)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --unit-tests --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "unit tests ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

  build:
    name: build ${{ matrix.target }}
    needs: [gate, unit-tests]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.blocking != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            blocking: true
          - target: linux-x64
            runner: ubuntu-24.04
            blocking: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            blocking: true
          - target: windows-x64
            runner: windows-2025
            msystem: UCRT64
          - target: windows-arm64
            runner: windows-11-arm
            msystem: CLANGARM64

    steps:
      - uses: actions/checkout@v5

      # The same per-platform prerequisites as CI (ci.yml says why): libcurl
      # headers on Linux; on Windows the MinGW-w64 toolchain, cmake, ninja,
      # pkgconf and the Schannel curl in an MSYS2 shell, where the build runs.
      - name: Install libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up the MinGW-w64 toolchain in MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # git is MSYS2's own (unprefixed): the script opens with
          # `git rev-parse`, and the shell's minimal PATH has no Git for Windows.
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl-winssl:p

      # Builds only. The suite ran in the `unit-tests` stage above, against
      # the source, and this job cannot start until it passed (user decision,
      # 2026-09-22). The step after packaging still proves the artifact RUNS,
      # which is the one executable-level check the pipeline keeps. On failure
      # lib/scripts/ci-annotate.sh publishes the log as error annotations,
      # readable through the public API without admin rights (ci.yml says why).
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      - name: Build (MSYS2 shell)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # The checkout was made by Git for Windows under a different HOME, so
        # MSYS2's git has to be told the tree is safe before the script's
        # first `git rev-parse`.
        run: |
          git config --global --add safe.directory '*'
          set -eo pipefail
          lib/scripts/cicd.sh --platform ${{ matrix.target }} --no-defer 2>&1 | tee "$RUNNER_TEMP/cicd.log" || {
            lib/scripts/ci-annotate.sh "build ${{ matrix.target }}" "$RUNNER_TEMP/cicd.log"
            exit 1
          }

      # Staged, proven to run, and uploaded as the artifact `apogee-<target>`
      # by the one packaging action ci.yml uses too -- the merge path and this
      # one cannot ship differently packaged archives.
      - name: Package
        uses: ./.github/actions/package
        with:
          target: ${{ matrix.target }}

  publish:
    name: publish release
    needs: [gate, build]
    runs-on: ubuntu-24.04
    if: needs.gate.outputs.proceed == 'true' && inputs.dry_run != true
    steps:
      - uses: actions/checkout@v5

      # v8 for the same Node 24 reason (v7 was the runtime bump). Two v8
      # behaviours are worth knowing here and both are wanted: a digest
      # mismatch now FAILS the download instead of logging a warning
      # (`digest-mismatch` defaults to `error`), which is what a pipeline that
      # publishes binaries should do rather than shipping a corrupt asset; and
      # decompression is decided per file by Content-Type, which unzips these
      # artifacts as before because they are uploaded archived.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # One call makes the tag AND the release, which is why nothing earlier in
      # this workflow pushes a tag. A blocking build failure therefore leaves
      # NOTHING behind to clean up -- no orphaned tag whose release never came,
      # which is the state that otherwise has to be unpicked by hand before a
      # retry. `--target` is the commit under test: on a tag push the tag
      # already exists and `--target` is simply ignored; a dispatch with
      # dry_run off tags the dispatched commit.
      #
      # Only the archives are attached: each artifact also carries the
      # `.source` record the merge path checks, which is not a release asset.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # The archives, and only those; nullglob because a Windows build is
          # allowed to fail here, and then there is no .zip to match.
          shopt -s nullglob
          assets=(artifacts/apogee-*.tar.gz artifacts/apogee-*.zip)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no archives were built"; exit 1; }
          # Create, or finish creating. `gh release create` is one call but not
          # one operation: it can make the release and then fail partway
          # through the asset uploads, which leaves a real release missing
          # assets. Re-running has to be able to complete that, so publishing
          # an existing release means uploading into it rather than failing.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} exists; uploading assets into it"
            gh release upload "${VERSION}" "${assets[@]}" --clobber
          else
            gh release create "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --generate-notes \
              "${assets[@]}"
          fi
          echo "published ${VERSION} at ${GITHUB_SHA} (attempt ${GITHUB_RUN_ATTEMPT})" >> "$GITHUB_STEP_SUMMARY"
