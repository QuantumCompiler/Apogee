# A bundled kit (42b): the utility role's two chores, in the product's own
# words. Mirrors source/business/agentloop/query_rewrite.cpp (rewrite_request:
# a follow-up rewritten as one standalone search query) and
# source/business/agentloop/tool_summary.cpp (summary_request: a tool's output
# summarised for the model that acts on it). Each prefix is byte for byte the
# product's request up to its first variable part, and every prompt rebuilds
# through those functions into itself -- tests/business/training/
# role_kits_test.cpp holds both, so a change to either request is a change
# here, in the same commit.
name: utility-chores
description: The utility role's chores in the product's own formats -- a follow-up rewritten as a standalone search query, and a tool's output summarised for the model that acts on it.
skill: utility-chores

prefixes:
  rewrite: |
    Rewrite the last question below as one standalone search query: fill in whatever it refers to from the conversation, so it can be understood with nothing before it. Reply with the query alone, on one line.

    Conversation:
  tool-summary: "Summarise this tool output for someone who will act on it. Keep exact names, numbers, paths, identifiers and error messages, and quote any lines the task is likely to need. Say briefly what kinds of content you left out. Reply with the summary only.\n\nTool: "

synth:
  system: |-
    You produce supervised fine-tuning examples that teach a small language model the two
    chores Apogee hands its utility model, each in the exact request format the product sends.

    Chore 1, "rewrite": a follow-up question rewritten as one standalone search query. The prompt
    is the conversation so far -- alternating lines that begin "User: " and "Assistant: ", at most
    six of them, each under 400 characters -- then a blank line, then "Last question: " and the
    follow-up. The follow-up must lean on the conversation ("it", "that one", "the second", "there",
    "and what about ..."). The completion is the query alone, on one line: the follow-up with every
    reference filled in from the conversation, so it can be searched with nothing before it. Keep
    the names exactly as the conversation spells them. No quotes, no "Query:" label, no explanation,
    never an answer to the question.

    Chore 2, "tool-summary": a tool's output summarised for the model that will act on it. The prompt
    is the tool's name, then a line "Arguments: " with the call's JSON arguments, then a blank line,
    "Output:" and the output itself -- realistic output of that tool (a command's stdout and
    [stderr] and [exit N] lines, a file's text, grep matches as path:line: text, a git log, a diff, a
    directory listing), long enough to be worth summarising but under about 1,500 characters. The
    completion is the summary only: keep exact names, numbers, paths, identifiers and error messages,
    quote any lines the task is likely to need, and say briefly what kinds of content were left out.
    The tools are read_file, list_directory, search_files, grep_files, run_command, git_status,
    git_log, git_diff and git_show.

    Vary the subjects widely: software, science, history, geography, operations, everyday questions.
  seeds:
    - "rewrite: a follow-up about a technical term defined earlier"
    - "rewrite: a follow-up naming 'the second one' from a list the assistant gave"
    - "rewrite: a follow-up about a place or person named two turns back"
    - "rewrite: a follow-up about a project or service named by the user"
    - "tool-summary: a failing test run from run_command"
    - "tool-summary: a configuration or source file from read_file"
    - "tool-summary: grep matches, a directory listing or a file search"
    - "tool-summary: a git log, a git diff or git show output"
  count: 200
  per_seed: 4
  temperature: 0.7

train:
  iters: 400
  num_layers: 16

eval:
  - prefix: rewrite
    prompt: |-
      User: What's the default port for PostgreSQL?
      Assistant: PostgreSQL listens on port 5432 unless postgresql.conf says otherwise.

      Last question: And how do I change it?
    expected: "PostgreSQL"
  - prefix: rewrite
    prompt: |-
      User: I'm reading about the Treaty of Westphalia.
      Assistant: It was a set of agreements signed in 1648 that ended the Thirty Years' War.

      Last question: Who signed it?
    expected: "Westphalia"
  - prefix: rewrite
    prompt: |-
      User: Can you explain how Raft elects a leader?
      Assistant: A follower that hears no heartbeat before its election timeout becomes a candidate, votes for itself and asks the others for their votes; a majority makes it leader.

      Last question: What happens if two candidates tie?
    expected: "Raft"
  - prefix: rewrite
    prompt: |-
      User: How tall is Mount Kilimanjaro?
      Assistant: About 5,895 metres -- the highest mountain in Africa.

      Last question: How long does the climb usually take?
    expected: "Kilimanjaro"
  - prefix: rewrite
    prompt: |-
      User: We use the retry_with_backoff helper in the payments service.
      Assistant: That helper retries a call with exponentially growing delays, capped at a maximum.

      Last question: Where is it defined?
    expected: "retry_with_backoff"
  - prefix: rewrite
    prompt: |-
      User: Tell me about the Voyager 1 probe.
      Assistant: Launched in 1977, it is the most distant human-made object and crossed into interstellar space in 2012.

      Last question: Is it still sending data?
    expected: "Voyager"
  - prefix: rewrite
    prompt: |-
      User: I'm choosing between SQLite and DuckDB for local analytics.
      Assistant: SQLite stores rows and suits transactional work; DuckDB stores columns and suits scans and aggregations.

      Last question: Which one handles large joins better?
    expected: "DuckDB"
  - prefix: rewrite
    prompt: |-
      User: Who designed the Eiffel Tower?
      Assistant: Gustave Eiffel's company built it; the engineers Maurice Koechlin and Emile Nouguier drew the first design.

      Last question: When was it finished?
    expected: "Eiffel Tower"
  - prefix: rewrite
    prompt: |-
      User: Our staging cluster is called orion-stg.
      Assistant: Noted -- orion-stg for staging.
      User: Deployments to it keep timing out.
      Assistant: Timeouts like that are often a readiness probe failing or an image pull stalling.

      Last question: How do I see its pod logs?
    expected: "orion-stg"
  - prefix: rewrite
    prompt: |-
      User: What is the Rust borrow checker?
      Assistant: It is the part of the Rust compiler that enforces ownership: any number of shared references, or exactly one mutable one, never both.

      Last question: Why does it reject two mutable references at once?
    expected: "borrow checker"
  - prefix: rewrite
    prompt: |-
      User: The meeting with the Lisbon office moved to Thursday.
      Assistant: Got it -- Thursday with Lisbon.

      Last question: What time is it there when it's 9am here in Chicago?
    expected: "Lisbon"
  - prefix: rewrite
    prompt: |-
      User: Explain the CAP theorem.
      Assistant: It says a distributed data store cannot guarantee consistency, availability and partition tolerance all at once: under a partition it must give up one of the first two.

      Last question: Which two does Cassandra favour?
    expected: "CAP"
  - prefix: tool-summary
